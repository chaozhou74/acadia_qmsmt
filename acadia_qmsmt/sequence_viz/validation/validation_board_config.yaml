# Test config for the 4-channel loopback runtime (LoopbackMultichannelRuntime).
# ch0=DAC0/ADC0, ch1=DAC2/ADC2, ch2=DAC4/ADC4, ch3=DAC6/ADC6 -- each pair expected to be
# physically cabled together. DAC/ADC 0 is the high-freq channel (7 GHz, mix_reconstruction on);
# DAC/ADC 2/4/6 are the low-freq channels (1 GHz, mix_reconstruction off).
# Placed here as an example; recommended to keep this on the data drive for a real station,
# same as test_config_walnut.yaml.

stimulus0:
  channel: DAC0
  channel_config:
    vop: 28000 # Gain of the DAC, ~ 2500-40000, adjust to your setup
    mix_reconstruction: true
    nco_frequency: 7.0e+9
  pulses:
    test_pulse:
      data: hann
      scale: 0.3
      ramp: 20e-9
      flat: 100e-9
      use_stretch: false
    # rb_stream gate set: three SHORT pulses that differ only in amplitude, so a
    # back-to-back train encodes its gate sequence as a staircase of plateau heights
    # (power ~ scale^2, i.e. 1 : 4 : 9) that stays readable even when the pulses merge.
    # Distinct amplitudes also mean distinct waveform memories -> distinct DMA words in
    # the cache, so the eventual per-gate decode has ground truth to check against.
    rb_gate_lo:
      data: hann
      scale: 0.15
      ramp: 10e-9
      flat: 20e-9
      use_stretch: false
    rb_gate_mid:
      data: hann
      scale: 0.30
      ramp: 10e-9
      flat: 20e-9
      use_stretch: false
    rb_gate_hi:
      data: hann
      scale: 0.45
      ramp: 10e-9
      flat: 20e-9
      use_stretch: false
    # rb_stream loop-gate LENGTH sweep: same shape, varied duration, to map the per-pulse
    # period vs pulse length across the ~110 ns fifo-refill floor (period = max(len, floor)).
    # Selected one at a time via rb_loop_gate; the loop then plays only this gate.
    rb_len_015: {data: hann, scale: 0.3, ramp: 2.5e-9, flat: 10e-9,  use_stretch: false}
    rb_len_030: {data: hann, scale: 0.3, ramp: 5e-9,   flat: 20e-9,  use_stretch: false}
    rb_len_060: {data: hann, scale: 0.3, ramp: 10e-9,  flat: 40e-9,  use_stretch: false}
    rb_len_090: {data: hann, scale: 0.3, ramp: 10e-9,  flat: 70e-9,  use_stretch: false}
    rb_len_120: {data: hann, scale: 0.3, ramp: 20e-9,  flat: 80e-9,  use_stretch: false}
    rb_len_150: {data: hann, scale: 0.3, ramp: 20e-9,  flat: 110e-9, use_stretch: false}
    # Stretchable pulse, for validating the half/hold/half DMA geometry the visualizer
    # draws. No detune: use_stretch and detune cannot coexist (compute_pulse raises).
    stretch_pulse:
      data: hann
      scale: 0.3
      ramp: 100e-9
      flat: 400e-9
      use_stretch: true
    # test_pulse edge to this one has no ramp mismatch. stretch_pulse keeps its 100 ns ramp for
    # the envelope/shape cases; the generated sequences use this one for timing.
    # Long ramps so pulse-shape fits have enough samples at the 5 ns capture spacing
    # (a 20 ns ramp is only 4 samples). Used by the stage-2 shape comparison.
    long_ramp_pulse:
      data: hann
      scale: 0.3
      ramp: 100e-9
      flat: 200e-9
      use_stretch: false
    # Stage 2: known SSB detunes, kept well under the 100 MHz Nyquist of the 5 ns capture
    # spacing. 10 MHz gives 20 samples/period, 25 MHz gives 8 -- both fit a phase slope.
    detune_10MHz:
      data: hann
      scale: 0.3
      ramp: 100e-9
      flat: 200e-9
      detune: 10.0e+6
      use_stretch: false
    detune_25MHz:
      data: hann
      scale: 0.3
      ramp: 100e-9
      flat: 200e-9
      detune: 25.0e+6
      use_stretch: false
    # Same shape as long_ramp_pulse with a pi/2 phase offset. NOTE: phase is in RADIANS
    # (scale_detune_pulse applies exp(1j*phase)).
    phase_half_pi:
      data: hann
      scale: 0.3
      ramp: 100e-9
      flat: 200e-9
      phase: 1.5707963267948966
      use_stretch: false

