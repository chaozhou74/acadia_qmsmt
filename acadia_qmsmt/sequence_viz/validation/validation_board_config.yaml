# msmt/loopback_measurements/loopback_board_config.yaml.
capture0:
  channel: ADC0
  channel_config:
    nco_frequency: 4700000000.0
  memories:
    dummy_trace:
      decimation: 4
      length: 2.0e-06
      region: plddr
