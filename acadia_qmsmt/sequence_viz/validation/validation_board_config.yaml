capture0:
  channel: ADC0
  channel_config:
    nco_frequency: 7.0e+9
  memories:
    loopback_trace:
      length: 1.2e-6 # seconds; padded beyond pre_pulse_dwell + pulse length -- see tail_trim_samples in the runtime
      decimation: 4 # fixed by the CMACC "input" passthrough tap (see runtime docstring); required for 32-bit dtype
      region: plddr

capture1:
  channel: ADC2
  channel_config:
    nco_frequency: 1.0e+9
  memories:
    loopback_trace:
      length: 1.2e-6
      decimation: 4
      region: plddr

capture2:
  channel: ADC4
  channel_config:
    nco_frequency: 1.0e+9
  memories:
    loopback_trace:
      length: 1.2e-6
      decimation: 4
      region: plddr

capture3:
  channel: ADC6
  channel_config:
    nco_frequency: 1.0e+9
  memories:
    loopback_trace:
      length: 1.2e-6
      decimation: 4
      region: plddr
    # Second accumulating memory, for the SECOND resonator in measure_multi. Simultaneous
    # multi-resonator readout (readout_confusion, the joint dual-rail readouts) puts two
    # measure() calls in ONE channel_synchronizer, and each resonator needs its own capture IO
    # and its own accumulating memory. This ADC is free in the readout cases: those trace only
    # ch0/ch1 (trace_channels), so ADC6's cmacc is unused.
    readout_accumulated:
      length: 4.0e-7
      decimation: 4
      region: plddr
  windows:
    boxcar:
      data: "np.ones(20)"

capture_dummy:
  channel: ADC1
  channel_config:
    nco_frequency: 7.0e+9
  memories:
    dummy_trace:
      length: 1.2e-6 # seconds; padded beyond pre_pulse_dwell + pulse length -- see tail_trim_samples in the runtime
      decimation: 4 # fixed by the CMACC "input" passthrough tap (see runtime docstring); required for 32-bit dtype
      region: plddr
    # Accumulating memory for the measure_* cases, which exercise
    # MeasurableResonator.measure() -- the readout path 94 of the qudit runtimes use and that
    # no loopback case reached (every other case captures a raw trace via stream_cmacc).
    # measure() lands here on ADC1, so it never contends with the four trace captures; those
    # cases set use_dummy_channel=False to free this ADC. What is physically MEASURED is the
    # readout PULSE the resonator schedules on its stimulus DAC, which is cabled to a trace ADC.
    readout_accumulated:
      length: 4.0e-7
      decimation: 4   # as on the trace memories: the CMACC "input" tap requires a 32-bit dtype,
                      # and decimation 1 gives int16 ("CMACC streams require destinations with
                      # 32-bit quadratures")
      region: plddr
  windows:
    # measure(window_name=None) takes the FIRST window here. Left without `data`, so
    # capture_cmacc takes its kernel-is-None branch and reads the accumulation length from
    # `memories.<name>.length` -- valid only for a memory given by NAME. A DUPLICATED capture
    # memory is an object, not a name, and raises KeyError there (the documented
    # readout_window_needs_data_when_capture_memory_is_duplicated / failure_019), which is why
    # `matched` below carries real kernel data for the two-round case.
    boxcar:
      # Real data, not null. An empty window dict raises KeyError: 'data', and a null one gets
      # as far as MeasurableResonator.load_windows() before failing with "Unable to load
      # WaveformMemory from object of type NoneType" -- load_windows has nothing to write. Every
      # window a runtime actually measures through carries a calibrated kernel, so carrying one
      # here matches real use as well as being the only thing that loads.
      data: "np.ones(20)"
    matched:
      # Written INLINE (yaml_editor evaluates an "np." string) rather than as a .npy path: a
      # relative path resolves against the CWD, not this file, and an absolute one bakes in one
      # machine -- which is exactly how Ziqian_measurements/config.yaml ended up pointing every
      # readout kernel at /home/c6/..., breaking 6 of the repo's own checks on any other station.
      # 80 samples = the 4.0e-7 s window at 5 ns/sample, decimation 1. A flat boxcar is the
      # natural "no weighting" demodulation vector; it is a fixture, not measured data.
      data: "np.ones(20)"   # 4.0e-7 s at 5 ns/sample with decimation 4
